name: Sync Upstream

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream:
        description: "Upstream repository (owner/repo)"
        required: false
        default: "llogick/zigscient"
      branch:
        description: "Branch to sync"
        required: false
        default: "dev"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || 'dev' }}

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM: ${{ inputs.upstream || 'llogick/zigscient' }}
          BRANCH: ${{ inputs.branch || 'dev' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "${BRANCH}"
          if git merge --no-edit "upstream/${BRANCH}"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.merge.outputs.status == 'clean'
        env:
          BRANCH: ${{ inputs.branch || 'dev' }}
        run: git push origin "HEAD:${BRANCH}"

      - name: Open pull request on conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream || 'llogick/zigscient' }}
          BRANCH: ${{ inputs.branch || 'dev' }}
        run: |
          git push origin "upstream/${BRANCH}:refs/heads/sync/upstream" --force
          if [ -n "$(gh pr list --head sync/upstream --state open --json number -q '.[0].number')" ]; then
            echo "::notice::Upstream sync PR already open"
          else
            gh pr create \
              --base "${BRANCH}" \
              --head sync/upstream \
              --title "Sync upstream ${UPSTREAM}:${BRANCH}" \
              --body "Automated upstream sync produced conflicts. Please resolve them in this pull request."
          fi